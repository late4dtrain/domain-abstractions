name: .NET

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4
            -   name: Setup .NET
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: 10.0.x
            -   name: Restore dependencies
                run: dotnet restore Late4dTrain.Domain.Abstractions.slnx
            -   name: Build
                run: dotnet build Late4dTrain.Domain.Abstractions.slnx --no-restore
            -   name: Test
                run: dotnet test Late4dTrain.Domain.Abstractions.slnx --no-build --verbosity normal
            -   name: Pack runtime and analyzer packages
                run: dotnet pack Late4dTrain.Domain.Abstractions.slnx -c Release --no-restore
            -   name: Restore analyzer consumer
                run: dotnet restore samples/analyzer-consumer/AnalyzerConsumer.csproj
            -   name: Build analyzer consumer
                run: dotnet build samples/analyzer-consumer/AnalyzerConsumer.csproj --no-restore
            -   name: Verify strict analyzer diagnostics
                run: bash samples/analyzer-consumer/verify-strict.sh
